[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-stress"
version = "0.1.0"
description = "Reproducible smooth-source flow-matching stress test"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=2", "scipy>=1.14", "matplotlib>=3.9", "pandas>=2", "einops>=0.8", "pyyaml>=6", "reportlab>=4", "pdfplumber>=0.11", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
include = ["fm_stress*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
